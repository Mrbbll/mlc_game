# 原地图移植；参数可调整，坐标统一在 locations.yml。
schema-version: 1
enabled: true
players:
  min: 2
  max: 16
countdown-seconds: 5
max-seconds: 240
limits:
  max-arena-blocks: 1000000
  max-snapshot-blocks: 100000
  blocks-per-tick: 1000
elimination-blocks:
- MAGMA_BLOCK
elimination-depth: 1
finish-materials:
- EMERALD_BLOCK
pvp-knockback: true
shorten-after-finishers: 4
shortened-seconds: 30
finish-points:
  first: 4
  second: 3
  third: 2
  remaining: 1
first-moving:
  min-seconds: 6
  max-seconds: 20
moving:
  min-seconds: 8
  max-seconds: 20
frozen:
  min-seconds: 3
  max-seconds: 6
movement-tolerance: 0.001
progress-interval-seconds: 5
progress-axis: X
