name: mlcgames
version: '1.0-SNAPSHOT'
main: com.mlc.mlcgames.Mlcgames
api-version: '26.3'
authors: [ Mr_bl ]
commands:
  party:
    description: 独立派对小游戏
    usage: /party <list|join|leave|start|stop|check|reload>
  reload:
    description: 重载
  bankgameprepare:
    description: 准备
  bankgamereload:
    description: 重载
  bankgameend:
    description: 结束
  zombieday:
    description: 僵尸末日
  sandgame:
    description: 沙子游戏
  dungeongame:
    description: 地牢游戏
  mlc:
    description: Blue Archive style combat attribute tools
    permission: mlcgames.combat.admin
permissions:
  mlcgames.party.play:
    description: 参加新派对小游戏
    default: true
  mlcgames.party.admin:
    description: 检查、开始、停止和重载新派对小游戏
    default: op
  mlcgames.combat.admin:
    description: Manage MLCGame combat attributes
    default: op
depend:
  - FastAsyncWorldEdit
softdepend:
  - ProtocolLib
  - ProtocolSupport
  - ViaVersion
  - ViaBackwards
  - ViaRewind
  - Geyser-Spigot
  - CraftEngine
