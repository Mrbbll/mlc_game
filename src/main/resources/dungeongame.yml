# Dungeon generation configuration.
layout:
  origin:
    x: 0
    # The lowest non-air block in every pasted schematic is aligned to this Y.
    y: 80
    z: 0
  # All 15 layouts share one world. Floors spread along X and dungeon levels
  # spread along Z. Values below 1600 are raised to 1600 to prevent overlap.
  stage-spacing:
    x: 2048
    z: 2048

# A bridge occupies one 16x16 chunk. Its usable road and the openings cut into
# both connected room walls are centred within that chunk.
passage:
  width: 8
  height: 8
  # Keep one floor block above the schematic's automatically aligned bottom.
  bottom-offset: 1

generation:
  # Used only by the single-layout debug command. A real game discovers and
  # randomly selects one available environment set for each dungeon floor.
  set: 1
  normal-rooms: 5
  special-chance: 70
  # easy, normal, hard
  difficulty: normal

# Blocks embedded in room schematics act only as encounter markers. They are
# replaced after generation and the mob appears one block above the marker.
markers:
  replacement: POLISHED_BLACKSTONE

encounters:
  # Every 8x8 opening belonging to an active room is sealed until it is clear.
  closed-door-block: BARRIER

progression:
  # A safe visible marker controlled by the plugin; walking within 2.25 blocks
  # teleports the player. Avoid END_PORTAL because vanilla handles it itself.
  portal-block: RESPAWN_ANCHOR
  # Cumulative monster health/damage increase per dungeon level:
  # level 1 = x1.0, level 2 = x1.5, level 3 = x2.25.
  level-stat-multiplier: 1.5

# Health/damage multipliers and difficulty-specific CraftEngine equipment.
# Put the real CraftEngine namespaced item IDs in helmet/chestplate. Their
# custom attributes are defined by CraftEngine, so each difficulty may point
# at a different pair of item definitions. Empty IDs deliberately equip none.
difficulty:
  easy:
    health-multiplier: 0.75
    damage-multiplier: 0.75
    armor:
      helmet: ""
      chestplate: ""
  normal:
    health-multiplier: 1.0
    damage-multiplier: 1.0
    armor:
      helmet: ""
      chestplate: ""
  hard:
    health-multiplier: 1.5
    damage-multiplier: 1.35
    armor:
      helmet: ""
      chestplate: ""

# Marker mapping:
#   SPAWNER         -> normal
#   TRIAL_SPAWNER   -> elite
#   CREAKING_HEART  -> boss
# Override priority:
# mobs.level-2.floor-3.normal -> mobs.floor-3.normal -> mobs.default.normal.
mobs:
  default:
    normal: [ZOMBIE, SKELETON, SPIDER]
    elite: [WITHER_SKELETON, HUSK]
    boss: [RAVAGER]

# Templates are read directly from FastAsyncWorldEdit/schematics, not from
# this file. File name format: floor_set_type_variant.schem
# floor = dungeon level (1-3), set = environment preset,
# type = room type, variant = room variation.
#
# Examples:
#   1_1_start_1.schem
#   1_1_normal_1.schem
#   1_1_shop_1.schem
#   1_1_end_1.schem
#   1_1_boss_1.schem
#   2_3_normal_2.schem
#   1_1_bridge_x_1.schem
#   1_1_bridge_z_1.schem
#
# Valid types: start, normal, end, boss, elit, shop, add.
# elit/shop/add are special side-room variants. A real game randomly selects
# one available set for each floor/level and then randomly selects variants.
# Grid dimensions match the web prototype and use Minecraft chunks:
#   start/normal/special/end: 2x2 chunks = 32x32 blocks
#   boss:                     3x3 chunks = 48x48 blocks
#   bridge_x / bridge_z:      1x1 chunk  = 16x16 blocks
# Room and bridge heights are unrestricted; their lowest non-air layers align.
