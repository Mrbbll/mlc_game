# Dungeon generation configuration.
layout:
  origin:
    x: 0
    y: 80
    z: 0
  # A schematic cannot be wider/deeper than this value.
  cell-size: 64

generation:
  # The second number in floor_set_type_variant.schem.
  set: 1
  normal-rooms: 7
  special-chance: 65

# Templates are read directly from FastAsyncWorldEdit/schematics, not from
# this file. File name format: floor_set_type_variant.schem
#
# Examples:
#   1_1_start_1.schem
#   1_1_normal_1.schem
#   1_1_shop_1.schem
#   1_1_end_1.schem
#   5_1_boss_1.schem
#
# Valid types: start, normal, end, boss, elit, shop, add.
# elit/shop/add are special side-room variants. The configured set is selected
# automatically; multiple matching variants are selected randomly.
