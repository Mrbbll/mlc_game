# Source blockrace migration. Set all map coordinates in locations.yml before enabling a map.
schema-version: 1
enabled: true
players:
  min: 2
  max: 16
countdown-seconds: 5
max-seconds: 600
limits:
  max-arena-blocks: 1000000
  max-snapshot-blocks: 1000000
  blocks-per-tick: 1000
elimination-blocks: []
elimination-depth: 1
finish-materials:
- TEST_BLOCK
pvp-knockback: false
shorten-after-finishers: 4
shortened-seconds: 30
finish-points:
  first: 4
  second: 3
  third: 2
  remaining: 1
