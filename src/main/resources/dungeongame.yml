# Dungeon generation configuration.
layout:
  origin:
    x: 0
    # The lowest non-air block in every pasted schematic is aligned to this Y.
    y: 80
    z: 0
  # All 15 layouts share one world. Floors spread along X and dungeon levels
  # spread along Z. Values below 1600 are raised to 1600 to prevent overlap.
  stage-spacing:
    x: 2048
    z: 2048

# A bridge occupies one 16x16 chunk. Its usable road and the openings cut into
# both connected room walls are centred within that chunk.
passage:
  width: 8
  height: 8
  # Keep one floor block above the schematic's automatically aligned bottom.
  bottom-offset: 1

generation:
  # Used only by the single-layout debug command. A real game discovers and
  # randomly selects one available environment set for each dungeon floor.
  set: 1
  normal-rooms: 5
  special-chance: 70
  # easy, normal, hard
  difficulty: normal

# Blocks embedded in room schematics act only as encounter markers. They are
# replaced after generation and the mob appears one block above the marker.
markers:
  replacement: POLISHED_BLACKSTONE

encounters:
  # Every 8x8 opening belonging to an active room is sealed until it is clear.
  closed-door-block: BARRIER
  # After the current wave is completely defeated, wait this long before the
  # next wave appears. Easy/normal/hard contain 2/3/4 waves respectively.
  next-wave-delay-ticks: 40

progression:
  # Put exactly one respawn anchor in every End and Boss schematic. It is
  # scanned as the exact portal position and hidden until progression unlocks.
  marker-block: RESPAWN_ANCHOR
  inactive-block: AIR
  # Block restored at that marker position. Walking within 2.25 blocks
  # teleports the player. Avoid END_PORTAL because vanilla handles it itself.
  portal-block: RESPAWN_ANCHOR
  # Cumulative monster health/damage increase per dungeon level:
  # level 1 = x1.0, level 2 = x1.5, level 3 = x2.25.
  level-stat-multiplier: 1.5

# A private scoreboard is created for every player inside the dungeon. Bukkit
# sends each scoreboard only to its owner, so one player's attributes never
# overwrite another player's display. Leaving the dungeon restores the normal
# MLC Games sidebar.
sidebar:
  # Entity-scope equipment and the current main-hand item's weapon-scope CE
  # attributes are combined. Negative weapon deltas (a weapon below the entity's
  # base value) are applied before the final attribute constraint is evaluated.
  # Main-hand changes are reflected within this many ticks.
  # Values are clamped to 5-200 ticks.
  refresh-ticks: 10
  title: "<gold><bold>dungeongame"
  # Up to 12 custom rows can be displayed. Unknown/unregistered CraftEngine
  # attributes show "--" instead of silently pretending that their value is 0.
  # Formats:
  #   number           raw numeric value
  #   percent          raw value * 100, followed by %
  #   multiplier       raw value displayed as xN
  #   bonus-multiplier raw bonus displayed as x(1 + N)
  attributes:
    - label: "<gray>命中值："
      id: "mlcgame:accuracy"
      format: number
    - label: "<gray>闪避值："
      id: "mlcgame:evasion"
      format: number
    - label: "<gray>暴击率："
      id: "mlcgame:critical_chance"
      format: percent
    - label: "<gray>暴击抗性："
      id: "mlcgame:critical_resistance"
      format: percent
    - label: "<gray>暴击倍率："
      id: "mlcgame:critical_multiplier"
      format: multiplier
    - label: "<gray>伤害倍率："
      id: "mlcgame:damage_bonus"
      format: bonus-multiplier
    - label: "<gray>伤害减免："
      id: "mlcgame:damage_reduction"
      format: percent

# CraftEngine pixel armour is discovered from loaded item IDs matching
# mlcgame:pixel_<set>_<helmet|chestplate|leggings|boots>. Only complete
# four-piece sets are eligible, and each mob receives one coherent random set.
dungeon-equipment:
  pixel-armor:
    namespace: mlcgame
    item-prefix: pixel_
    # Fallback visual-set -> combat armour-type mapping, used only if the CE
    # helmet has no mlcgames:armor_type PDC. Values below are valid examples:
    # LIGHT, HEAVY, SPECIAL, ELASTIC. Unmapped sets use the random pool.
    armor-type-by-set: {}
  armor-types: [LIGHT, HEAVY, SPECIAL, ELASTIC]

# Health/damage multipliers plus additive armour attributes on every equipped
# pixel-armour piece. A complete set applies the per-piece bonus four times.
difficulty:
  easy:
    health-multiplier: 0.75
    damage-multiplier: 0.75
    armor:
      attribute-bonus-per-piece: 0.0
      toughness-bonus-per-piece: 0.0
  normal:
    health-multiplier: 1.0
    damage-multiplier: 1.0
    armor:
      attribute-bonus-per-piece: 0.5
      toughness-bonus-per-piece: 0.25
  hard:
    health-multiplier: 1.5
    damage-multiplier: 1.35
    armor:
      attribute-bonus-per-piece: 1.0
      toughness-bonus-per-piece: 0.5

# Mob definitions are loaded from plugins/mlcgames/dungeongame/mobs/
# using <dungeon-level>_<environment-set>.yml, for example 1_1.yml.
# Marker mapping remains SPAWNER -> normal, TRIAL_SPAWNER -> elite and
# CREAKING_HEART -> boss. Each marker is reused once per encounter wave.

# Templates are read directly from FastAsyncWorldEdit/schematics, not from
# this file. File name format: floor_set_type_variant.schem
# floor = dungeon level (1-3), set = environment preset,
# type = room type, variant = room variation.
#
# Examples:
#   1_1_start_1.schem
#   1_1_normal_1.schem
#   1_1_shop_1.schem
#   1_1_end_1.schem
#   1_1_boss_1.schem
#   2_3_normal_2.schem
#   1_1_bridge_x_1.schem
#   1_1_bridge_z_1.schem
#
# Valid types: start, normal, end, boss, elit, shop, add.
# elit/shop/add are special side-room variants. A real game randomly selects
# one available set for each floor/level and then randomly selects variants.
# Grid dimensions match the web prototype and use Minecraft chunks:
#   start/normal/special/end: 2x2 chunks = 32x32 blocks
#   boss:                     3x3 chunks = 48x48 blocks
#   bridge_x / bridge_z:      1x1 chunk  = 16x16 blocks
# Room and bridge heights are unrestricted; their lowest non-air layers align.
