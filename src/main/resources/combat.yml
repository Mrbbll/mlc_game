# 战斗相性主配置：控制系统开关、默认攻击/防御类型、相性结果与倍率。
# 无法读取攻击类型时使用 NONE；未佩戴头盔或头盔未标注防御类型时也使用 NONE。
# NONE 与任何类型的相性均为 NORMAL，因此普通原版战斗不会受到额外倍率影响。
enabled: true
defaults:
  attack-type: NONE
multipliers:
  WEAK: 2.0
  EFFECTIVE: 1.5
  NORMAL: 1.0
  RESIST: 0.5
affinity:
  EXPLOSIVE:
    LIGHT: WEAK
    HEAVY: NORMAL
    SPECIAL: RESIST
    ELASTIC: RESIST
  PIERCING:
    LIGHT: RESIST
    HEAVY: WEAK
    SPECIAL: NORMAL
    ELASTIC: NORMAL
  MYSTIC:
    LIGHT: NORMAL
    HEAVY: RESIST
    SPECIAL: WEAK
    ELASTIC: NORMAL
  SONIC:
    LIGHT: NORMAL
    HEAVY: RESIST
    SPECIAL: EFFECTIVE
    ELASTIC: WEAK
